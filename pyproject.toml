[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "developer-automation-toolkit"
version = "0.1.0"
description = "Cross-platform Developer Automation Toolkit (DAT) - IDE-independent CLI & MCP Server"
readme = "README.md"
authors = [{ name = "Developer Automation Toolkit Team" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "python-docx>=0.8.11",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "pillow>=9.0.0",
    "requests>=2.25.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
gui = [
    "customtkinter>=5.2.0",
    "tkinterdnd2>=0.3.0",
]

[project.scripts]
dat = "dat.main:main"
