[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "developer-automation-toolkit"
version = "0.2.0"
description = "Cross-platform Developer Automation Toolkit (DAT) - IDE-independent CLI & MCP Server"
readme = "README.md"
authors = [{ name = "Developer Automation Toolkit Team" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "python-docx>=0.8.11",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "pillow>=9.0.0",
    "requests>=2.25.1",
    "customtkinter>=5.2.0",
    # 0.4+ is the first line shipping an osx-arm64 tkdnd binary; older
    # releases install cleanly on Apple Silicon but fail to load at runtime,
    # silently costing drag-and-drop.
    "tkinterdnd2>=0.4.0"
]

keywords = ["cli", "automation", "documentation", "mcp", "docx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://github.com/Priyansu-Kr/DAT_CLI"
Repository = "https://github.com/Priyansu-Kr/DAT_CLI"
Issues = "https://github.com/Priyansu-Kr/DAT_CLI/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
dat = "dat.main:main"

[tool.setuptools.packages.find]
include = ["dat*"]

[tool.setuptools.package-data]
dat = ["*.png"]
